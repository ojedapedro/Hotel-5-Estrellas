# ============================================================
# Nginx — Configuración Reverse Proxy + SSL
# Hotel ERP 5 Estrellas
# 
# Pasos:
#   1. Copiar este archivo a /etc/nginx/sites-available/hotel-erp
#   2. Reemplazar "tu-dominio.com" con tu dominio real
#   3. Ejecutar: sudo certbot --nginx -d tu-dominio.com -d api.tu-dominio.com
#   4. sudo ln -s /etc/nginx/sites-available/hotel-erp /etc/nginx/sites-enabled/
#   5. sudo nginx -t && sudo systemctl reload nginx
# ============================================================

# Redirigir HTTP → HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name tu-dominio.com api.tu-dominio.com;

    # Ruta para verificación de Let's Encrypt
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── Frontend ───────────────────────────────────────────────
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name tu-dominio.com;

    # SSL — Let's Encrypt (Certbot lo completa automáticamente)
    ssl_certificate /etc/letsencrypt/live/tu-dominio.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tu-dominio.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/hotel-erp;
    index index.html;

    # Logs
    access_log /var/log/nginx/hotel-erp-frontend.access.log;
    error_log  /var/log/nginx/hotel-erp-frontend.error.log;

    # Gzip
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript;

    # SPA Fallback — necesario para React Router
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache largo para assets con hash (Vite genera nombres únicos)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options nosniff;
    }

    # Cabeceras de seguridad
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}

# ── Backend API + WebSockets ───────────────────────────────
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.tu-dominio.com;

    ssl_certificate /etc/letsencrypt/live/api.tu-dominio.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.tu-dominio.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Logs
    access_log /var/log/nginx/hotel-erp-backend.access.log;
    error_log  /var/log/nginx/hotel-erp-backend.error.log;

    # Límite de tamaño de body (para uploads de archivos)
    client_max_body_size 50M;

    # Rate limiting básico
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=100r/m;

    location / {
        limit_req zone=api_limit burst=50 nodelay;

        proxy_pass http://localhost:3001;
        proxy_http_version 1.1;

        # Headers necesarios para WebSockets (Socket.io)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Headers estándar de proxy
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeout extendido para WebSockets
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        proxy_connect_timeout 60s;

        # Buffer settings
        proxy_buffering off;
        proxy_cache_bypass $http_upgrade;
    }

    # Cabeceras de seguridad
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
}
