# ============================================================
# Docker Compose — PRODUCCIÓN
# Hotel ERP 5 Estrellas — NestJS + PostgreSQL + Redis
# Uso: docker compose -f docker-compose.prod.yml up -d
# ============================================================

version: '3.8'

services:

  # ── PostgreSQL 15 ──────────────────────────────────────────
  postgres:
    image: postgres:15-alpine
    container_name: hotel_postgres_prod
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: hotel_erp
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - hotel_network
    # NO exponer el puerto al exterior en producción (solo interno)
    expose:
      - '5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USER} -d hotel_erp']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ── Redis 7 ────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: hotel_redis_prod
    restart: always
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD}
      --appendonly yes
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
    volumes:
      - redis_prod_data:/data
    networks:
      - hotel_network
    expose:
      - '6379'
    healthcheck:
      test: ['CMD', 'redis-cli', '--no-auth-warning', '-a', '${REDIS_PASSWORD}', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ── Backend NestJS ─────────────────────────────────────────
  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
      target: runner
    image: hotel-erp-backend:latest
    container_name: hotel_backend_prod
    restart: always
    env_file:
      - apps/backend/.env.production
    environment:
      # Sobreescribir la URL de DB para usar el contenedor interno
      DATABASE_URL: postgresql://${DB_USER}:${DB_PASSWORD}@postgres:5432/hotel_erp?schema=public
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    ports:
      - '3001:3001'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - hotel_network
    # Límites de recursos
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '1'
        reservations:
          memory: 256M

# ── Redes ──────────────────────────────────────────────────
networks:
  hotel_network:
    driver: bridge
    name: hotel_erp_network

# ── Volúmenes persistentes ─────────────────────────────────
volumes:
  postgres_prod_data:
    driver: local
    name: hotel_postgres_data
  redis_prod_data:
    driver: local
    name: hotel_redis_data
