name: 🚀 Deploy Hotel ERP 5 Estrellas

on:
  push:
    branches:
      - main
  workflow_dispatch:   # Permite disparar manualmente desde GitHub UI

env:
  NODE_VERSION: '20'
  PNPM_VERSION: '12'

jobs:
  # ── Job 1: Build y test ──────────────────────────────────────
  build-and-test:
    name: 🔨 Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout código
        uses: actions/checkout@v4

      - name: ⚙️ Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: 🟢 Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: 📦 Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: 🏗️ Build paquetes compartidos
        run: |
          pnpm --filter @hotel/shared-types build
          pnpm --filter @hotel/shared-utils build

      - name: 🧪 Tests del backend
        run: pnpm --filter backend test
        continue-on-error: true  # No bloquear deploy si los tests fallan por ahora

      - name: 🌐 Build Frontend
        run: pnpm --filter frontend build
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
          VITE_WS_URL: ${{ secrets.VITE_WS_URL }}

      - name: 📤 Subir artefacto del frontend
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: apps/frontend/dist
          retention-days: 1

  # ── Job 2: Deploy Frontend a Vercel ─────────────────────────
  deploy-frontend:
    name: 🌐 Deploy Frontend → Vercel
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
      - name: 📥 Checkout código
        uses: actions/checkout@v4

      - name: ⚙️ Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: 📦 Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: 🌐 Build Frontend
        run: pnpm --filter frontend build
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
          VITE_WS_URL: ${{ secrets.VITE_WS_URL }}

      - name: 🚀 Deploy a Vercel (Producción)
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          working-directory: apps/frontend
          vercel-args: '--prod'

  # ── Job 3: Deploy Backend al VPS ────────────────────────────
  deploy-backend:
    name: ⚙️ Deploy Backend → VPS
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
      - name: 🔗 Conectar al VPS y desplegar
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script: |
            set -e

            echo "📂 Entrando al directorio del proyecto..."
            cd /opt/hotel-erp

            echo "⬇️ Obteniendo últimos cambios..."
            git pull origin main

            echo "🐳 Reconstruyendo y levantando contenedores..."
            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml up -d --build --remove-orphans

            echo "⏳ Esperando que el backend esté listo..."
            sleep 15

            echo "🗄️ Ejecutando migraciones de Prisma..."
            docker compose -f docker-compose.prod.yml exec -T backend npx prisma migrate deploy

            echo "🧹 Limpiando imágenes Docker antiguas..."
            docker image prune -f

            echo "✅ Deploy completado exitosamente!"
            echo "🏨 Hotel ERP corriendo en: https://api.${{ secrets.DOMAIN }}"

  # ── Job 4: Notificación ──────────────────────────────────────
  notify:
    name: 📢 Notificación
    runs-on: ubuntu-latest
    needs: [deploy-frontend, deploy-backend]
    if: always()

    steps:
      - name: 📊 Estado del deploy
        run: |
          echo "Frontend: ${{ needs.deploy-frontend.result }}"
          echo "Backend:  ${{ needs.deploy-backend.result }}"
